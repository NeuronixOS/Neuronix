<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer Noto Color Emoji over DejaVu/Noto Sans outlines</description>

  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="lang">
      <string>und-zsye</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- gtk-edit / Cascadia: missing emoji codepoints should not pick DejaVu. -->
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Cascadia Code</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Cascadia Mono</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Inter</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- Outline fonts that ship B&W emoji (DejaVu, FreeSans, …) steal those
       codepoints from Noto Color Emoji. Drop emoji ranges from non-color fonts. -->
  <match target="scan">
    <test name="color" compare="not_eq">
      <bool>true</bool>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x2600</int><int>0x27bf</int></range>
          <range><int>0x1f300</int><int>0x1f64f</int></range>
          <range><int>0x1f680</int><int>0x1f6ff</int></range>
          <range><int>0x1f7e0</int><int>0x1f7ff</int></range>
          <range><int>0x1f900</int><int>0x1f9ff</int></range>
          <range><int>0x1fa00</int><int>0x1faff</int></range>
        </charset>
      </minus>
    </edit>
  </match>
  <!-- Chrome Fontations paints Debian CBDT Noto Color Emoji as grayscale.
       ISO ships COLRv1 at /usr/local/share/fonts/noto/Noto-COLRv1.ttf. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
