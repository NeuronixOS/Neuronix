[main]
font=Sans:size=11
# Must support "-e <cmd>" (XDG Terminal=true). gtk-term does not; foot does.
terminal=foot -e
# Reparent via Hyprland so pkexec/polkit dialogs work (fuzzel exits too fast otherwise).
launch-prefix=neuronix-desktop-exec
prompt="❯ "
lines=12
width=42
icon-theme=Papirus

[colors]
background=0a0a0af2
text=f5f5f5ff
match=c41e3aff
border=444444ff
selection=2a2a2aff
selection-text=ffffffff
selection-match=c41e3aff
