[main]
font=Sans:size=24
# Must support "-e <cmd>" (XDG Terminal=true). gtk-term does not; foot does.
terminal=foot -e
# Reparent via Hyprland so pkexec/polkit dialogs work (fuzzel exits too fast otherwise).
launch-prefix=neuronix-desktop-exec
prompt="> "
lines=10
# Full-width bottom bar: neuronix-fuzzel sets --output/--width/--horizontal-pad
# so the prompt + matches sit in a centered column (fuzzel has no text-align).
width=80
anchor=bottom
layer=overlay
horizontal-pad=24
vertical-pad=20
inner-pad=16
icon-theme=Papirus
dpi-aware=no

[colors]
# Near-black ~35% opaque (much more transparent over the desktop)
background=0a0a0a59
text=f5f5f5ff
match=c41e3aff
border=444444ff
selection=2a2a2aaa
selection-text=ffffffff
selection-match=c41e3aff

[border]
width=10
radius=8
