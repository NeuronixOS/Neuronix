[main]
font=Sans:size=24
# gtk-term-launch.sh accepts -e / --command (xdg-terminal-exec / fuzzel).
terminal=gtk-term-launch.sh -e
# Reparent via Hyprland so pkexec/polkit dialogs work (fuzzel exits too fast otherwise).
launch-prefix=neuronix-desktop-exec neuronix-launch
prompt="> "
lines=12
# neuronix-fuzzel: full-width bottom bar; modest pads, list left-aligned.
# Large selected SVG icon needs spare height under the match list; a smaller
# ratio keeps that preview visible with several matches (default 0.5 ≈ one).
image-size-ratio=0.28
width=80
anchor=bottom
layer=overlay
horizontal-pad=28
vertical-pad=20
inner-pad=16
icon-theme=Papirus-Dark
dpi-aware=no

[colors]
# Monokai bg ~35% opaque (much more transparent over the desktop)
background=272822f2
text=f8f8f2ff
match=693400ff
border=3c3d37ff
selection=3c3d37ff
selection-text=f8f8f2ff
selection-match=693400ff

[border]
width=10
radius=8
