bind = CTRL SUPER ALT SHIFT, KP_1, exec, $window_manager wide-left
bind = CTRL SUPER ALT SHIFT MOD2, KP_1, exec, $window_manager wide-left
bind = CTRL SUPER ALT SHIFT, KP_End, exec, $window_manager wide-left
bind = CTRL SUPER ALT SHIFT MOD2, KP_End, exec, $window_manager wide-left
bind = CTRL SUPER ALT SHIFT, KP_2, exec, $window_manager wide-bottom
bind = CTRL SUPER ALT SHIFT MOD2, KP_2, exec, $window_manager wide-bottom
bind = CTRL SUPER ALT SHIFT, KP_Down, exec, $window_manager wide-bottom
bind = CTRL SUPER ALT SHIFT MOD2, KP_Down, exec, $window_manager wide-bottom
bind = CTRL SUPER ALT SHIFT, KP_3, exec, $window_manager wide-right
bind = CTRL SUPER ALT SHIFT MOD2, KP_3, exec, $window_manager wide-right
bind = CTRL SUPER ALT SHIFT, KP_Next, exec, $window_manager wide-right
bind = CTRL SUPER ALT SHIFT MOD2, KP_Next, exec, $window_manager wide-right
bind = CTRL SUPER ALT, KP_Next, exec, $window_manager right
bind = CTRL SUPER ALT MOD2, KP_Next, exec, $window_manager right
bind = CTRL SUPER ALT, KP_4, exec, $window_manager middle-left
