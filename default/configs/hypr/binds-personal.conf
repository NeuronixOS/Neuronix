bind = CTRL SUPER ALT, KP_8, exec, $window_manager top
bind = CTRL SUPER ALT MOD2, KP_8, exec, $window_manager top
bind = CTRL SUPER ALT, KP_Up, exec, $window_manager top
bind = CTRL SUPER ALT MOD2, KP_Up, exec, $window_manager top
bind = CTRL SUPER ALT, KP_9, exec, $window_manager top-right
bind = CTRL SUPER ALT MOD2, KP_9, exec, $window_manager top-right
bind = CTRL SUPER ALT, KP_Prior, exec, $window_manager top-right
