# While fuzzel is up: left-click a grid cell picks that window and closes fuzzel.
# Clicks on the fuzzel bar are redelivered (see overview-pick). Letters / Enter stay with fuzzel.
submap = hdmi-overview-launcher
bind = , mouse:272, exec, $window_manager overview-pick
bind = , escape, exec, $window_manager overview-cancel
bind = , Escape, exec, $window_manager overview-cancel
bindr = SUPER, Super_L, exec, $window_manager overview
bindr = SUPER, Super_R, exec, $window_manager overview
submap = reset

# Brief hop while redelivering a click to fuzzel (no mouse bind here).
submap = hdmi-overview-pass
bind = , escape, exec, $window_manager overview-cancel
bind = , Escape, exec, $window_manager overview-cancel
submap = reset
