# KvNix personal binds — sourced from stock hyprland.conf via:
#   source = ./binds-personal.conf
# Deep-merged over default/configs/hypr/. This overlay also ships a workstation
# hyprland.conf (4 HDMI desks, workspace-cycle, theme colors).
#
# App chords: Ctrl+Alt+Super (+ MOD2 twin when NumLock is on).
# Window parking: arrows / numpad via window-manager.py.
# Paths use $HOME / installed suite bins — never Dropbox.

$window_manager = $HOME/.config/hypr/window-manager.py

# --- HDMI / DP window parking (Ctrl+Super+Alt) ---
# HDMI stays floating. DP-3 / DP-4 stay tiled.
# New windows default to HDMI bottom-center.
# Same slot already occupied → cascade slightly (title bars of the ones behind stay visible).
# 1-9: same 3×3 cells, 25% wider than a third, height that plus 10%
# Shift+1-9: the same nine positions, two-thirds width and height
# 0: equal-size floating grid on the current HDMI workspace
# Arrows: left/right tile onto DP-3 / DP-4; up fills HDMI; down bottom-center
unbind = SUPER SHIFT, left
unbind = SUPER SHIFT, right
unbind = SUPER SHIFT, Up
unbind = SUPER SHIFT, Down
unbind = SUPER SHIFT, up
unbind = SUPER SHIFT, down
unbind = SUPER ALT, Left
unbind = SUPER ALT, Right
unbind = SUPER ALT, left
unbind = SUPER ALT, right

# Arrows + top-row 0 (with and without NumLock/MOD2)
bind = CTRL SUPER ALT, Up, exec, $window_manager hdmi-full
bind = CTRL SUPER ALT MOD2, Up, exec, $window_manager hdmi-full
bind = CTRL SUPER ALT, up, exec, $window_manager hdmi-full
bind = CTRL SUPER ALT MOD2, up, exec, $window_manager hdmi-full
bind = CTRL SUPER ALT, Down, exec, $window_manager bottom
bind = CTRL SUPER ALT MOD2, Down, exec, $window_manager bottom
bind = CTRL SUPER ALT, down, exec, $window_manager bottom
bind = CTRL SUPER ALT MOD2, down, exec, $window_manager bottom
bind = CTRL SUPER ALT, Left, exec, $window_manager dp-left
bind = CTRL SUPER ALT MOD2, Left, exec, $window_manager dp-left
bind = CTRL SUPER ALT, left, exec, $window_manager dp-left
bind = CTRL SUPER ALT MOD2, left, exec, $window_manager dp-left
bind = CTRL SUPER ALT, Right, exec, $window_manager dp-right
bind = CTRL SUPER ALT MOD2, Right, exec, $window_manager dp-right
bind = CTRL SUPER ALT, right, exec, $window_manager dp-right
bind = CTRL SUPER ALT MOD2, right, exec, $window_manager dp-right
# Ctrl+Super+Alt + left-click (or 0): equal-size floating grid on HDMI.
bind = CTRL SUPER ALT, mouse:272, exec, $window_manager grid
bind = CTRL SUPER ALT MOD2, mouse:272, exec, $window_manager grid
bind = CTRL SUPER ALT, 0, exec, $window_manager grid
bind = CTRL SUPER ALT MOD2, 0, exec, $window_manager grid

# Number row + numpad: 3×3 HDMI float grid (bottom / middle / top)
bind = CTRL SUPER ALT, 1, exec, $window_manager left
bind = CTRL SUPER ALT MOD2, 1, exec, $window_manager left
bind = CTRL SUPER ALT, 2, exec, $window_manager bottom
bind = CTRL SUPER ALT MOD2, 2, exec, $window_manager bottom
bind = CTRL SUPER ALT, 3, exec, $window_manager right
bind = CTRL SUPER ALT MOD2, 3, exec, $window_manager right
bind = CTRL SUPER ALT SHIFT, 1, exec, $window_manager wide-left
bind = CTRL SUPER ALT SHIFT MOD2, 1, exec, $window_manager wide-left
bind = CTRL SUPER ALT SHIFT, 2, exec, $window_manager wide-bottom
bind = CTRL SUPER ALT SHIFT MOD2, 2, exec, $window_manager wide-bottom
bind = CTRL SUPER ALT SHIFT, 3, exec, $window_manager wide-right
bind = CTRL SUPER ALT SHIFT MOD2, 3, exec, $window_manager wide-right
bind = CTRL SUPER ALT SHIFT, 4, exec, $window_manager wide-middle-left
bind = CTRL SUPER ALT SHIFT MOD2, 4, exec, $window_manager wide-middle-left
bind = CTRL SUPER ALT SHIFT, 5, exec, $window_manager wide-middle
bind = CTRL SUPER ALT SHIFT MOD2, 5, exec, $window_manager wide-middle
bind = CTRL SUPER ALT SHIFT, 6, exec, $window_manager wide-middle-right
bind = CTRL SUPER ALT SHIFT MOD2, 6, exec, $window_manager wide-middle-right
bind = CTRL SUPER ALT SHIFT, 7, exec, $window_manager wide-top-left
bind = CTRL SUPER ALT SHIFT MOD2, 7, exec, $window_manager wide-top-left
bind = CTRL SUPER ALT SHIFT, 8, exec, $window_manager wide-top
bind = CTRL SUPER ALT SHIFT MOD2, 8, exec, $window_manager wide-top
bind = CTRL SUPER ALT SHIFT, 9, exec, $window_manager wide-top-right
bind = CTRL SUPER ALT SHIFT MOD2, 9, exec, $window_manager wide-top-right
bind = CTRL SUPER ALT, 4, exec, $window_manager middle-left
bind = CTRL SUPER ALT MOD2, 4, exec, $window_manager middle-left
bind = CTRL SUPER ALT, 5, exec, $window_manager middle
bind = CTRL SUPER ALT MOD2, 5, exec, $window_manager middle
bind = CTRL SUPER ALT, 6, exec, $window_manager middle-right
bind = CTRL SUPER ALT MOD2, 6, exec, $window_manager middle-right
bind = CTRL SUPER ALT, 7, exec, $window_manager top-left
bind = CTRL SUPER ALT MOD2, 7, exec, $window_manager top-left
bind = CTRL SUPER ALT, 8, exec, $window_manager top
bind = CTRL SUPER ALT MOD2, 8, exec, $window_manager top
bind = CTRL SUPER ALT, 9, exec, $window_manager top-right
bind = CTRL SUPER ALT MOD2, 9, exec, $window_manager top-right

# Numpad: NumLock on = KP_N; off = Insert/End/Down/Next/Left/Begin/Right/Home/Up/Prior
bind = CTRL SUPER ALT, KP_0, exec, $window_manager grid
bind = CTRL SUPER ALT MOD2, KP_0, exec, $window_manager grid
