# Window border (gtk-theme overwrites this). Hyprbars titlebar (− □ ×) stays
# on floating HDMI windows only. Tight 2px gaps between tiled windows.
general {
    border_size = 3
    gaps_in = 2
    col.active_border = rgba(837b69ff) rgba(4b4841ff) 0deg
    col.inactive_border = rgba(343330ff) rgba(3c3a36ff) 0deg
    resize_on_border = true
    hover_icon_on_border = true
}

# Tiled portraits (DP-3 / DP-4): no hyprbars chrome; floats keep − □ ×.
windowrule = match:float false, hyprbars:no_bar on

# New apps open as HDMI bottom-center floats; Ctrl+Super+Alt then parks them.
exec-once = $window_manager watch
# Monitor hot-plug: do NOT auto-start kanshi on this workstation.
# kanshi's wlr-output-management apply drops DP-4 (right portrait) on nouveau;
# Hyprland monitors.conf already reapplies layout on connect.
# exec-once = sh -c 'command -v kanshi >/dev/null && kanshi'

# Portrait DP-3/DP-4 use transform,3 on nouveau. Hardware cursors then draw
# at a different point than the click, so hits feel “off”. Software cursor
# keeps the hotspot aligned. HDMI alignment (y=972) only affects edge-crossing.
cursor {
    no_hardware_cursors = true
}

# DP-3 / DP-4 stay on their own desks; HDMI owns 1–4 (see workspaces.conf).
source = ./workspaces.conf

# HDMI apps float immediately; DP-3/DP-4 keep dwindle tiling.
# window-manager.py then parks HDMI windows in the Ctrl+Super+Alt+2 slot.
windowrule = match:class .*, match:workspace m[HDMI-A-1], float on
# Screensaver covers HDMI floats (those stack above a normal fullscreen window).
windowrule = match:class ^(org\.neuronix\.Screensaver)$, float on
windowrule = match:class ^(org\.neuronix\.Screensaver)$, fullscreen on
windowrule = match:class ^(org\.neuronix\.Screensaver)$, opacity 1.0 override 1.0 override
windowrule = match:class ^(org\.neuronix\.Screensaver)$, hyprbars:no_bar true
windowrule = match:class ^(org\.neuronix\.Screensaver)$, border_size 0
windowrule = match:class ^(org\.neuronix\.Screensaver)$, rounding 0
windowrule = match:class ^(org\.neuronix\.Screensaver)$, no_shadow on
# Chrome restores a last-session size that can be larger than HDMI; allow shrink.
windowrule = match:class ^(google-chrome|Google-chrome|chromium|Chromium|chromium-browser|chrome-.*)$, no_max_size on

# gtk-photos picture/video viewers: float so window-manager.py can grid them
# bottom-left across, then up. Organizer title is skipped.
windowrule = match:class ^(org\.neuronix\.GtkPhotos)$, match:title (?i).+\.(jpe?g|png|gif|webp|bmp|svg|ico|tiff?|heic|heif)$, float on
windowrule = match:class ^(org\.neuronix\.GtkPhotos)$, match:title (?i).+\.(jpe?g|png|gif|webp|bmp|svg|ico|tiff?|heic|heif)$, tag +gtk-photos-media
windowrule = match:class ^(org\.neuronix\.GtkPhotos)$, match:title (?i).+\.(mp4|avi|webm|mov|m4v|flv|wmv|mpg|mpeg|3gp|ogv|mts|m2ts)$, float on
windowrule = match:class ^(org\.neuronix\.GtkPhotos)$, match:title (?i).+\.(mp4|avi|webm|mov|m4v|flv|wmv|mpg|mpeg|3gp|ogv|mts|m2ts)$, tag +gtk-photos-media
windowrule = match:class ^(gtk-photos-media)$, float on
windowrule = match:class ^(gtk-photos-media)$, tag +gtk-photos-media
# Chromium --app viewers (videos + leftover image HTML) keep class chromium on Wayland.
windowrule = match:class ^(chromium|Chromium|chromium-browser|google-chrome|Google-chrome)$, match:title (?i).+\.(jpe?g|png|gif|webp|bmp|svg|ico|tiff?|heic|heif|mp4|avi|webm|mov|m4v|flv|wmv|mpg|mpeg|3gp|ogv|mts|m2ts)$, float on
windowrule = match:class ^(chromium|Chromium|chromium-browser|google-chrome|Google-chrome)$, match:title (?i).+\.(jpe?g|png|gif|webp|bmp|svg|ico|tiff?|heic|heif|mp4|avi|webm|mov|m4v|flv|wmv|mpg|mpeg|3gp|ogv|mts|m2ts)$, tag +gtk-photos-media
windowrule = match:tag gtk-photos-media, float on

# gtk-photos dialogs (folder picker, trash confirm, alerts) — center, don't grid.
windowrule = match:class ^(org\.neuronix\.GtkPhotos)$, match:modal true, float on
windowrule = match:class ^(org\.neuronix\.GtkPhotos)$, match:modal true, center on
windowrule = match:class ^(org\.neuronix\.GtkPhotos)$, match:title (?i)(destination|trash|thumbnail|folder not found|moving files|create new folder|choose photos), float on
windowrule = match:class ^(org\.neuronix\.GtkPhotos)$, match:title (?i)(destination|trash|thumbnail|folder not found|moving files|create new folder|choose photos), center on

# Suite AlertDialog / confirm sheets — float + center (don't let them get yanked).
windowrule = match:title ^(Delete Permanently)$, float on
windowrule = match:title ^(Delete Permanently)$, center on
windowrule = match:title ^(Move to Trash)$, float on
windowrule = match:title ^(Move to Trash)$, center on
windowrule = match:title ^(Empty Trash)$, float on
windowrule = match:title ^(Empty Trash)$, center on
windowrule = match:title ^(Rename)$, float on
windowrule = match:title ^(Rename)$, center on
windowrule = match:title ^(New Folder)$, float on
windowrule = match:title ^(New Folder)$, center on
windowrule = match:title ^(Preferences)$, float on
windowrule = match:title ^(Preferences)$, center on
windowrule = match:title ^(Properties)$, float on
windowrule = match:title ^(Properties)$, center on

# Popup no-border rules live in hyprland.conf (xdg_tag). Do not strip every
# floating Chrome window — that removed the grab border on the main browser.

# =============================================================================
# App / clipboard chords (Ctrl+Alt+Super, MOD2 twins for NumLock)
# =============================================================================

# --- Notes ---
bind = CTRL SUPER ALT, Y, exec, neuronix-launch env GSK_RENDERER=ngl gtk-edit $HOME/Sync/TODAY
bind = CTRL SUPER ALT MOD2, Y, exec, neuronix-launch env GSK_RENDERER=ngl gtk-edit $HOME/Sync/TODAY
bind = CTRL SUPER ALT, I, exec, neuronix-launch env GSK_RENDERER=ngl gtk-edit $HOME/Sync/Spectros/TODO/In-Progress/TODO-CURRENT
bind = CTRL SUPER ALT MOD2, I, exec, neuronix-launch env GSK_RENDERER=ngl gtk-edit $HOME/Sync/Spectros/TODO/In-Progress/TODO-CURRENT

# --- Clipboard snippets ---
bind = CTRL SUPER ALT, C, exec, bash -c "printf '\u2713 ' | wl-copy"
bind = CTRL SUPER ALT MOD2, C, exec, bash -c "printf '\u2713 ' | wl-copy"
bind = CTRL SUPER ALT, space, exec, bash -c "printf '\U1F4A4 ' | wl-copy"
bind = CTRL SUPER ALT MOD2, space, exec, bash -c "printf '\U1F4A4 ' | wl-copy"
bind = CTRL SUPER ALT, U, exec, sh -c 'for p in "$HOME/.config/secrets/github-token" "$HOME/configs/secrets/github-token"; do [ -r "$p" ] && wl-copy < "$p" && exit 0; done'
bind = CTRL SUPER ALT MOD2, U, exec, sh -c 'for p in "$HOME/.config/secrets/github-token" "$HOME/configs/secrets/github-token"; do [ -r "$p" ] && wl-copy < "$p" && exit 0; done'

# --- Sites / browsers ---
bind = CTRL SUPER ALT, F, exec, neuronix-launch neuronix-chromium https://www.onlyfans.com
bind = CTRL SUPER ALT MOD2, F, exec, neuronix-launch neuronix-chromium https://www.onlyfans.com
bind = CTRL SUPER ALT, M, exec, neuronix-launch neuronix-chrome --disable-gpu --app=https://gemini.google.com
bind = CTRL SUPER ALT MOD2, M, exec, neuronix-launch neuronix-chrome --disable-gpu --app=https://gemini.google.com
bind = CTRL SUPER ALT, K, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory=Default
bind = CTRL SUPER ALT MOD2, K, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory=Default
bind = CTRL SUPER ALT, L, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory="Profile 5"
bind = CTRL SUPER ALT MOD2, L, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory="Profile 5"
bind = CTRL SUPER ALT, W, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory="Profile 1"
bind = CTRL SUPER ALT MOD2, W, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory="Profile 1"
bind = CTRL SUPER ALT, D, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory="Profile 4"
bind = CTRL SUPER ALT MOD2, D, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory="Profile 4"
bind = CTRL SUPER ALT, O, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory="Profile 2"
bind = CTRL SUPER ALT MOD2, O, exec, neuronix-launch neuronix-chrome --disable-gpu https://www.google.com --new-window --profile-directory="Profile 2"

# --- Files / suite apps (PATH-installed via neuronix-launch) ---
bind = CTRL SUPER ALT, J, exec, neuronix-launch gtk-files $HOME/SORT
bind = CTRL SUPER ALT MOD2, J, exec, neuronix-launch gtk-files $HOME/SORT
bind = CTRL SUPER ALT, S, exec, neuronix-launch gtk-files $HOME/SORT
bind = CTRL SUPER ALT MOD2, S, exec, neuronix-launch gtk-files $HOME/SORT
bind = CTRL SUPER ALT, N, exec, neuronix-launch gtk-files ~
bind = CTRL SUPER ALT MOD2, N, exec, neuronix-launch gtk-files ~
bind = CTRL SUPER ALT SHIFT, N, exec, neuronix-launch env GSK_RENDERER=ngl gtk-edit
bind = CTRL SUPER ALT SHIFT MOD2, N, exec, neuronix-launch env GSK_RENDERER=ngl gtk-edit
bind = CTRL SUPER ALT, backslash, exec, neuronix-launch gtk-photos
bind = CTRL SUPER ALT MOD2, backslash, exec, neuronix-launch gtk-photos
bind = CTRL SUPER ALT, X, exec, neuronix-launch gtk-calc
