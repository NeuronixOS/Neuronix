# Optional personalize binds.
# Stock hyprland.conf sources this file. Overlay may replace it with real binds.
# Keep empty (comments only) in default/ so `source =` always succeeds.
#
# Volume (raise/lower/mute + Ctrl+Alt up/down) is wired in stock hyprland.conf
# to /usr/local/bin/neuronix-volume (active sink). Waybar scroll/middle-click
# also call neuronix-volume (default/configs/waybar/config).
#
# KvNix personalize overlays HDMI parking (window-manager.py), Super overview,
# 4-desk workspace-cycle, NumLock MOD2 volume twins, HDMI floats into the
# Ctrl+Super+Alt+2 slot, and tiled DP portraits.
