bind = CTRL ALT SHIFT MOD2, N, exec, neuronix-launch env GSK_RENDERER=ngl gtk-edit

# Volume keys → active output (playing sink, else default). ISO ships the
# fixed neuronix-volume in /usr/local/bin; ~/.local/bin wins if present.
$vol = neuronix-volume
unbind = CTRL ALT, up
unbind = CTRL ALT, down
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
bind = CTRL ALT, up, exec, $vol +5
bind = CTRL ALT MOD2, up, exec, $vol +5
bind = CTRL ALT, down, exec, $vol -5
bind = CTRL ALT MOD2, down, exec, $vol -5
bind = , XF86AudioRaiseVolume, exec, $vol +5
bind = , XF86AudioLowerVolume, exec, $vol -5
bind = , XF86AudioMute, exec, $vol mute-toggle

# Super overview: fuzzel opens with the zoomed-out grid.
# Click a window to pick it (closes fuzzel). Type to search apps. Escape / Super again cancels.
# After fuzzel exits, letters reopen it; Alt+Tab or arrows select; Enter confirms.
submap = hdmi-overview
bind = , mouse:272, exec, $window_manager overview-pick
bind = , return, exec, $window_manager overview-confirm
bind = , Return, exec, $window_manager overview-confirm
bind = ALT, Tab, exec, $window_manager overview-next
bind = ALT SHIFT, Tab, exec, $window_manager overview-prev
bind = ALT, ISO_Left_Tab, exec, $window_manager overview-prev
bind = , left, exec, $window_manager overview-left
bind = , Left, exec, $window_manager overview-left
bind = , right, exec, $window_manager overview-right
bind = , Right, exec, $window_manager overview-right
bind = , up, exec, $window_manager overview-up
bind = , Up, exec, $window_manager overview-up
bind = , down, exec, $window_manager overview-down
bind = , Down, exec, $window_manager overview-down
bind = , escape, exec, $window_manager overview-cancel
bind = , Escape, exec, $window_manager overview-cancel
bindr = SUPER, Super_L, exec, $window_manager overview
bindr = SUPER, Super_R, exec, $window_manager overview
# Typing a letter opens fuzzel over the grid (overview stays until Enter/click).
bind = , a, exec, $window_manager overview-fuzzel a
bind = , b, exec, $window_manager overview-fuzzel b
bind = , c, exec, $window_manager overview-fuzzel c
