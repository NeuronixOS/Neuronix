# Neuronix Hyprland — GNOME-style shortcuts (black / red / white chrome elsewhere)

env = GSK_RENDERER,cairo
env = GTK_THEME,Adwaita-dark
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3

xwayland {
    enabled = true
}

monitor=,preferred,auto,1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP GSK_RENDERER GTK_THEME QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME GTK_ICON_THEME
exec-once = /usr/share/neuronix/neuronix-hyprland-session-start.sh

general {
    gaps_in = 12
    gaps_out = 18
    border_size = 2
    col.active_border = rgba(505050aa)
    col.inactive_border = rgba(2a2a2a88)
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 8
    # Hyprspace needs slight transparency to capture window textures in overview
    # (1.0 → blank/black thumbnails on Hyprland 0.55). Keep <1.0 even for floats.
    active_opacity = 0.97
    inactive_opacity = 0.97
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        # Don't blur behind opaque window surfaces (stops “bleed through” look)
        ignore_opacity = false
        xray = false
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
        # Soft grey shadow (was near-opaque black)
        color = rgba(00000055)
    }
}

# ~2× default speed (global default is 8ds; lower = faster)
animations {
    enabled = true
    animation = global, 1, 4, default
    animation = windows, 1, 3.5, default
    animation = windowsIn, 1, 3.5, default
    animation = windowsOut, 1, 3, default
    animation = fade, 1, 3.5, default
    animation = fadeIn, 1, 3, default
    animation = fadeOut, 1, 3, default
    animation = workspaces, 1, 3, default
    animation = workspacesIn, 1, 3, default
    animation = workspacesOut, 1, 3, default
}

misc {
    background_color = rgb(0a0a0a)
    # Allow Super alone (Activities → Hyprspace overview) without eating other Super binds
    enable_swallow = false
    disable_hyprland_logo = true
    disable_hyprland_guiutils_check = true
}

# Quiet Hyprland’s bottom “tips” / donation / update nags
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

debug {
    suppress_errors = true
}

input {
    kb_layout = us,us
    kb_options = grp:win_space_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

$mod = SUPER

# --- Neuronix daily apps (non-conflicting) ---
bind = $mod, Return, exec, neuronix-launch gtk-term
bind = $mod, E, exec, neuronix-launch gtk-files
bind = $mod, T, exec, neuronix-launch gtk-term
bind = $mod, G, exec, neuronix-launch gtk-edit
bind = $mod, comma, exec, neuronix-launch neuronix-settings

# --- Extra shortcuts (CTRL+ALT, native binds) ---
bind = CTRL ALT, T, exec, neuronix-launch gtk-term
bind = CTRL ALT, X, exec, neuronix-launch gtk-calc
bind = CTRL ALT, N, exec, neuronix-launch gtk-files ~
bind = CTRL ALT SHIFT, N, exec, neuronix-launch gtk-edit
bind = CTRL ALT, equal, exec, neuronix-launch gtk-colors
bind = CTRL ALT, up, exec, neuronix-volume +5
bind = CTRL ALT, down, exec, neuronix-volume -5

# =============================================================================
# 1. System & Navigation (GNOME)
# =============================================================================
# Super → workspace overview (Hyprspace; release Super alone)
# Parks Waybar under the strip so desktops sit above the top bar.
bindr = SUPER, Super_L, exec, neuronix-overview-toggle
bindr = SUPER, Super_R, exec, neuronix-overview-toggle
# Escape closes overview + restores Waybar, or dismisses fuzzel; else passes through
bind = , Escape, exec, neuronix-escape
# Ctrl+Super → Applications (Fuzzel; release Super while Ctrl held)
# Modmask must include both CTRL and SUPER (Hyprland "only modkeys" rule)
bindr = CTRL SUPER, Super_L, exec, neuronix-fuzzel
bindr = CTRL SUPER, Super_R, exec, neuronix-fuzzel
# Super+A → Applications
bind = $mod, A, exec, neuronix-fuzzel
# Super+V / Super+M → notification history / dismiss
bind = $mod, V, exec, makoctl restore
bind = $mod, M, exec, makoctl dismiss --all
# Super+L → lock
bind = $mod, L, exec, dm-tool lock
# Alt+F2 → run command
bind = ALT, F2, exec, neuronix-fuzzel
# Ctrl+Alt+Del → session / power menu
bind = CTRL ALT, Delete, exec, neuronix-launch nwg-bar
# Super+Space → keyboard layout (input.kb_options grp:win_space_toggle)

# =============================================================================
# 2. Window switcher & management (GNOME)
# =============================================================================
bind = $mod, Tab, cyclenext,
bind = $mod, Tab, bringactivetotop,
bind = $mod SHIFT, Tab, cyclenext, prev
# Super + ` (grave) → same-app style cycle (best-effort: next window)
bind = $mod, grave, cyclenext,
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT, Escape, cyclenext,
bind = ALT, F4, killactive,
bind = CTRL, Q, killactive,
# Maximize / restore
bind = $mod, Up, fullscreen, 1
bind = $mod, Down, fullscreen, 0
# Snap left / right (move window in layout)
bind = $mod, Left, movewindow, l
bind = $mod, Right, movewindow, r
# Minimize → special workspace (restore: Super+Shift+H)
bind = $mod, H, movetoworkspacesilent, special:minimized
bind = $mod SHIFT, H, togglespecialworkspace, minimized
# Alt+F7 move mode / Alt+F8 resize mode
bind = ALT, F7, submap, gnomemove
submap = gnomemove
binde = , left, movewindow, l
binde = , right, movewindow, r
binde = , up, movewindow, u
binde = , down, movewindow, d
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

bind = ALT, F8, submap, gnomeresize
submap = gnomeresize
binde = , left, resizeactive, -40 0
binde = , right, resizeactive, 40 0
binde = , up, resizeactive, 0 -40
binde = , down, resizeactive, 0 40
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Alt+Space → settings hub (window ops stand-in)
bind = ALT, Space, exec, neuronix-launch neuronix-settings

# Focus (Hyprland: Super+Ctrl+arrows — Super+arrows are snap)
bind = $mod CTRL, left, movefocus, l
bind = $mod CTRL, right, movefocus, r
bind = $mod CTRL, up, movefocus, u
bind = $mod CTRL, down, movefocus, d

# =============================================================================
# 3. Workspaces & monitors (GNOME)
# =============================================================================
bind = $mod, page_down, workspace, +1
bind = $mod, page_up, workspace, -1
# Ctrl+Alt+←/→ → previous / next desktop
bind = CTRL ALT, left, workspace, -1
bind = CTRL ALT, right, workspace, +1
# Ctrl+Shift+Alt+←/→ → take active window to previous / next desktop
bind = CTRL ALT SHIFT, left, movetoworkspace, -1
bind = CTRL ALT SHIFT, right, movetoworkspace, +1
bind = $mod SHIFT, page_down, movetoworkspace, +1
bind = $mod SHIFT, page_up, movetoworkspace, -1
bind = $mod SHIFT, left, movewindow, mon:l
bind = $mod SHIFT, right, movewindow, mon:r

# Always keep four desktops so Hyprspace overview shows a stable base set.
# Higher desks are created on demand (showNewWorkspace + scroll); empty ones may
# be GC'd by Hyprland unless they have windows.
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true

# Numbered workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# =============================================================================
# 4. Screenshots & screen recording (GNOME)
# =============================================================================
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = ALT, Print, exec, sh -c 'mkdir -p "$HOME/Pictures" && grim -g "$(slurp)" "$HOME/Pictures/Screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"'
bind = SHIFT, Print, exec, sh -c 'mkdir -p "$HOME/Pictures" && grim "$HOME/Pictures/Screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"'
bind = CTRL ALT SHIFT, R, exec, sh -c 'if pgrep -x wf-recorder >/dev/null; then pkill -x wf-recorder; notify-send "Recording" "Stopped"; elif command -v wf-recorder >/dev/null; then mkdir -p "$HOME/Videos" && wf-recorder -f "$HOME/Videos/Recording-$(date +%Y-%m-%d_%H-%M-%S).mp4" & notify-send "Recording" "Started"; else notify-send "Recording" "Install wf-recorder to enable"; fi'

# =============================================================================
# 5. Accessibility (GNOME) — best-effort
# =============================================================================
bind = ALT $mod, S, exec, sh -c 'command -v orca >/dev/null && (pgrep -x orca >/dev/null && pkill -x orca || orca &) || notify-send "Screen reader" "Install orca to enable"'
bind = ALT $mod, 8, exec, notify-send "Zoom" "Screen magnifier is not configured on Neuronix Hyprland"
bind = $mod ALT, equal, exec, notify-send "Zoom" "Screen magnifier is not configured on Neuronix Hyprland"
bind = $mod ALT, minus, exec, notify-send "Zoom" "Screen magnifier is not configured on Neuronix Hyprland"

# =============================================================================
# Media keys
# =============================================================================
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioRaiseVolume, exec, neuronix-volume +5
bind = , XF86AudioLowerVolume, exec, neuronix-volume -5
bind = , XF86AudioMute, exec, neuronix-volume mute-toggle

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
# Right-click empty desktop → wallpaper picker (bindn: apps still receive RMB)
bindn = , mouse:273, exec, neuronix-desktop-rmb

# Load hyprbars / Hyprspace. Packaged or ISO-built .so via ensure helpers.
# hyprpm reload first (optional ABI plugins), then ensure-* re-loads ISO .so
# so an unpatched hyprpm Hyprspace cannot replace our patched build.
exec-once = hyprpm reload -n
exec-once = neuronix-ensure-hyprbars
exec-once = neuronix-ensure-hyprspace
exec-once = neuronix-overview-defaults

plugin {
    hyprbars {
        enabled = true
        bar_height = 36
        # Opaque charcoal (rgb alone can composite oddly on floating dialogs)
        bar_color = rgba(2e2e2eff)
        col.text = rgb(f5f5f5)
        bar_text_font = Sans
        bar_text_size = 11
        bar_text_align = left
        bar_buttons_alignment = right
        bar_button_padding = 10
        bar_padding = 12
        bar_precedence_over_border = true
        # true: bar shares window opacity/backdrop (avoids black strip over wallpaper)
        bar_part_of_window = true
        inactive_button_color = rgb(2e2e2e)
        # GNOME-style flat controls: bgcolor matches bar (no colored discs),
        # fgcolor is the light-grey glyph. Order is R→L so L→R is − □ ×.
        hyprbars-button = rgb(2e2e2e), 18, ×, hyprctl dispatch killactive, rgb(c0c0c0)
        hyprbars-button = rgb(2e2e2e), 18, □, hyprctl dispatch fullscreen 1, rgb(c0c0c0)
        hyprbars-button = rgb(2e2e2e), 18, −, hyprctl dispatch movetoworkspacesilent special:minimized, rgb(c0c0c0)
        on_double_click = hyprctl dispatch fullscreen 1
    }
    overview {
        # Hyprspace — Neuronix black / red / white chrome
        # drawActiveWorkspace=true → fullscreen black zoom on Hyprland 0.55.
        # ISO hook 998 patches Hyprspace so the active thumb still gets window
        # stubs; decoration opacity 0.97 lets stubs work while real windows stay
        # visible on the desktop under the strip.
        # Transparent workspace backgrounds let hyprpaper show through the stubs.
        # affectStrut cannot push Waybar (layer-shell); neuronix-overview-toggle
        # parks Waybar under the strip with margin-top instead.
        # hideRealLayers=true paints panelColor over the desk → looks like a
        # "black screen" under the strip; keep false so the live desk stays visible.
        drawActiveWorkspace = false
        affectStrut = false
        overrideGaps = false
        disableBlur = true
        hideBackgroundLayers = false
        hideTopLayers = true
        hideOverlayLayers = true
        hideRealLayers = false
        reservedArea = 0
        panelColor = rgba(0a0a0aee)
        panelBorderColor = rgba(505050aa)
        workspaceActiveBackground = rgba(00000000)
        workspaceInactiveBackground = rgba(00000000)
        workspaceActiveBorder = rgba(ffffffff)
        workspaceInactiveBorder = rgba(444444ff)
        # Keep in sync with NEURONIX_OVERVIEW_PANEL_HEIGHT / overview-toggle default
        # Half of prior 240 so more desktops fit / mousewheel can reach higher ones
        panelHeight = 120
        panelBorderWidth = 1
        workspaceMargin = 6
        workspaceBorderSize = 2
        centerAligned = true
        # Always show a trailing "new desktop" slot so the strip can grow past
        # persistent desks (scroll was stuck at #4 when this was false).
        showNewWorkspace = true
        showEmptyWorkspace = true
        # Close via Super / Escape (neuronix-escape) / left-click empty desktop.
        # exitOnClick uses Hyprspace hide(); patch 0002 notifies
        # neuronix-overview-toggle sync so Waybar is restored.
        # Empty exitKey disables Hyprspace's own Escape handler (avoids double-Esc).
        exitKey =
        exitOnClick = true
        exitOnSwitch = false
        switchOnDrop = true
        autoDrag = true
        # Strip: mousewheel pans tiles (patch 0003). Outside strip: wheel selects
        # desktops (creates next; wraps at 32).
        autoScroll = true
    }
}

# Float some utilities (dialogs stay centered, not tiled edge-to-edge)
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, float on
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, center on
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(pavucontrol)$, center on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(nm-connection-editor)$, center on
windowrule = match:class ^(xfce4-power-manager-settings)$, float on
windowrule = match:class ^(xfce4-power-manager-settings)$, center on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(blueman-manager)$, center on
windowrule = match:class ^(blueman-manager)$, size 720 520
windowrule = match:class ^(blueman-adapters)$, float on
windowrule = match:class ^(blueman-adapters)$, center on
windowrule = match:class ^(blueman-adapters)$, size 520 360
windowrule = match:class ^(galculator)$, float on
windowrule = match:class ^(galculator)$, center on
windowrule = match:class ^(org\.linuxos\.GtkCalc)$, float on
windowrule = match:class ^(org\.linuxos\.GtkCalc)$, center on
windowrule = match:class ^(org\.linuxos\.GtkCalc)$, size 360 480
windowrule = match:class ^(zenity)$, float on
windowrule = match:class ^(zenity)$, center on
windowrule = match:class ^(zenity)$, border_size 0
windowrule = match:class ^(polkit-mate-authentication-agent-1)$, float on
windowrule = match:class ^(polkit-mate-authentication-agent-1)$, center on
windowrule = match:class ^(Polkit-mate-authentication-agent-1)$, float on
windowrule = match:class ^(Polkit-mate-authentication-agent-1)$, center on
windowrule = match:class ^(polkit-gnome-authentication-agent-1)$, float on
windowrule = match:class ^(polkit-gnome-authentication-agent-1)$, center on
windowrule = match:title ^(Authenticate)$, float on
windowrule = match:title ^(Authenticate)$, center on
windowrule = match:class ^(neuronix-choice)$, float on
windowrule = match:class ^(neuronix-choice)$, center on
windowrule = match:class ^(neuronix-choice)$, border_size 0
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, center on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, size 780 560
windowrule = match:class ^(xdg-desktop-portal-gtk)$, border_size 0
# Calamares: keep branding windowSize (avoid nearly-fullscreen float)
windowrule = match:class ^(io\.calamares\.calamares)$, float on
windowrule = match:class ^(io\.calamares\.calamares)$, center on
windowrule = match:class ^(io\.calamares\.calamares)$, size 920 620
# Floats nearly opaque (must stay <1.0 so Hyprspace can stub textures; 1.0 → black thumbs)
windowrule = match:float true, opacity 0.97 override 0.97 override

windowrule = match:float true, force_rgbx on
windowrule = match:float true, no_blur on

# Personalize extras (default is empty; overlay may replace this file)
source = ./binds-personal.conf

