<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer Noto COLRv1 over Debian CBDT emoji</description>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
