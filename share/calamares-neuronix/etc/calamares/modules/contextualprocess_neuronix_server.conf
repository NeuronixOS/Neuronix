# Console + SSH when Server profile was chosen (purges slim-live GUI).
---
dontChroot: false
timeout: 1800

"packagechooser_neuronix-profile":
  server:
    - command: "/usr/local/sbin/neuronix-apply-server-profile.sh"
  desktop:
    - command: "bash -c 'echo \"[neuronix] Desktop profile — skipping server console setup\"'"
