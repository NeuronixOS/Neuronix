---
# LightDM — live ISO: autologin user=live (50-neuronix-live-autologin; removed on install).
# Installed disk: autologin-session=neuronix-hyprland (98-neuronix-autologin.conf).

displaymanagers:
  - lightdm

defaultDesktopEnvironment:
    executable: "/usr/share/neuronix/neuronix-hyprland-session.sh"
    desktopFile: "neuronix-hyprland"

basicSetup: false
sysconfigSetup: false

lightdm:
  preferred_greeters: ["lightdm-gtk-greeter.desktop", "lightdm-greeter.desktop", "slick-greeter.desktop"]
