---
# Live images may ship /etc/ssh/sshd_not_to_be_run; remove before enabling units.
# Strip live-only LightDM autologin drop-in; keep 98-neuronix-autologin.conf (Hyprland autologin).
# Enable SSH remote login for the Calamares-created user (password from users module).
dontChroot: false
timeout: 60

script:
  - command: "rm -f /etc/lightdm/lightdm.conf.d/50-neuronix-live-autologin.conf"
  - command: "rm -f /etc/lightdm/lightdm.conf.d/88-neuronix-openbox-session.conf /etc/lightdm/lightdm.conf.d/88-neuronix-hyprland-session.conf /etc/lightdm/lightdm.conf.d/99-neuronix-steam-session.conf /etc/lightdm/lightdm.conf.d/90-neuronix-openbox-first-session.conf /etc/lightdm/lightdm.conf.d/97-neuronix-autologin-steam.conf /etc/lightdm/lightdm.conf.d/99-neuronix-autologin-steam.conf"
  - command: "chmod 0755 /usr/local/bin/neuronix-session-action /usr/local/bin/neuronix-settings /usr/local/bin/neuronix-change-background /usr/local/bin/neuronix-desktop-rmb /usr/local/bin/neuronix-datetime /usr/local/bin/neuronix-calendar /usr/local/bin/neuronix-power-settings /usr/local/bin/neuronix-ensure-power-manager /usr/local/bin/neuronix-ensure-hyprspace /usr/local/bin/neuronix-fix-hyprspace-now /usr/local/bin/neuronix-overview-defaults /usr/local/bin/neuronix-overview-toggle /usr/local/bin/neuronix-ensure-hyprbars /usr/share/neuronix/neuronix-hyprland-session.sh /usr/share/neuronix/neuronix-hyprland-session-start.sh 2>/dev/null || true"
  - command: "chmod 0644 /usr/share/neuronix/neuronix_choice_dialog.py /usr/share/neuronix/neuronix-hyprland-session-env.sh /usr/share/neuronix/neuronix-wallpaper-hyprpaper.sh /usr/share/neuronix/neuronix-session-log.sh /usr/share/wayland-sessions/neuronix-hyprland.desktop /usr/share/applications/neuronix-files.desktop /usr/share/applications/neuronix-logout.desktop /usr/share/applications/neuronix-restart.desktop /usr/share/applications/neuronix-reboot.desktop /usr/share/applications/neuronix-shutdown.desktop /etc/lightdm/lightdm.conf.d/10-neuronix-lightdm-debug.conf 2>/dev/null || true"
  - command: "/usr/local/sbin/neuronix-add-user-input-group.sh"
  - command: "/usr/local/sbin/neuronix-install-crontab.sh"
  - command: "/usr/local/sbin/neuronix-link-system-configs.sh"
  - command: "/usr/local/sbin/neuronix-enable-flathub.sh"
  - command: "/usr/local/sbin/neuronix-enable-ssh"
