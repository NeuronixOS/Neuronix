---
# Blocks “Next” until RAM and live internet checks pass (APT + shellprocess
# installers need a reachable Debian mirror). Join Wi‑Fi in the live session first
# (e.g. Waybar network module, nm-connection-editor, or nmtui in kgx) if you need wireless.
#
# When a *mandatory* requirement fails, Calamares ModuleManager re-runs checks every
# 5 seconds (CountdownWaitingWidget on this page) until they pass — same as Gamebian.
# Live ISO prep (neuronix-live-calamares-prep) drops the storage check (overlay size is
# not the target disk) and fixes DNS so the internet poll can succeed after you connect.

showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 10
  requiredRam: 1.5
  # Try several endpoints; Debian paths can differ by suite redirects.
  internetCheckUrl:
    - https://www.debian.org/
    - https://deb.debian.org/
    - https://networkcheck.kde.org/

  check:
    - storage
    - ram
    - internet

  # Must satisfy all of these for the installer to proceed past Welcome.
  # (On live boot, storage lines are stripped by neuronix-live-calamares-prep.)
  required:
    - storage
    - ram
    - internet

geoip:
  style: "none"
