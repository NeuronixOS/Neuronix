# Configuration file for Calamares
# Syntax is YAML 1.2
# Derived from calamares-settings-debian; branding points at Neuronix overlay.
---

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: neuronix-profile
  module: packagechooser
  config: packagechooser_neuronix_profile.conf
- id: neuronix-strip-desktop
  module: shellprocess
  config: shellprocess_neuronix_strip_desktop.conf
- id: neuronix-server-packages
  module: shellprocess
  config: shellprocess_neuronix_server_packages.conf
- id: neuronix-desktop-hooks
  module: contextualprocess
  config: contextualprocess_neuronix_desktop.conf
- id: neuronix-server-profile
  module: contextualprocess
  config: contextualprocess_neuronix_server.conf
- id: neuronix-sshprep
  module: shellprocess
  config: shellprocess_neuronix_sshprep.conf
- id: neuronix-network
  module: shellprocess
  config: shellprocess_neuronix_network.conf
- id: neuronix-apt-sources
  module: shellprocess
  config: shellprocess_neuronix_apt_sources.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - packagechooser@neuronix-profile
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - shellprocess@neuronix-network
  - hwclock
  - services-systemd
  - bootloader-config
  - sources-final
  - sources-media-unmount
  - shellprocess@neuronix-apt-sources
  - shellprocess@neuronix-strip-desktop
  - shellprocess@neuronix-server-packages
  - packages
  - contextualprocess@neuronix-desktop-hooks
  - displaymanager
  - contextualprocess@neuronix-server-profile
  - shellprocess@neuronix-sshprep
  - services-systemd
  - grubcfg
  - bootloader
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - umount
- show:
  - finished

branding: neuronix

prompt-install: false
dont-chroot: false
